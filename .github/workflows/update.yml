name: Aggiornamento Automatico Calendari

on:
  schedule:
    # Ogni domenica sera alle 21:00 UTC (dopo le partite del weekend)
    - cron: '0 21 * * 0'
    # Ogni lunedì mattina alle 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Avvio manuale da GitHub oppure dall'istanza Render dopo un refresh
    inputs:
      use_cache:
        description: 'Usa i dati già aggiornati sull''istanza Render (nessun nuovo scraping)'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

# Permessi minimi a livello di workflow: ogni job alza solo ciò che gli serve,
# così il job di verifica sulle pull request resta in sola lettura.
permissions:
  contents: read

jobs:
  # Test automatici: parser, exporter e API del server + coerenza degli asset
  # di root pubblicati su GitHub Pages (che sono generati da public/).
  verifica:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: Configurazione Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Installazione dipendenze
        run: npm ci

      - name: Verifica asset di root allineati a public/
        run: npm run check:pages

      - name: Test
        run: npm test

  scrape-and-update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    concurrency:
      group: update
      cancel-in-progress: false
    # Serve scrivere i dati nel repository e chiedere la build di Pages
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: Installazione dipendenze
        run: npm ci

      - name: Aggiornamento dati (IP residenziale Raspberry Pi con fallback remoto)
        id: aggiorna
        env:
          SCRAPER_MODE: http
          RENDER_URL: ${{ vars.RENDER_URL || 'https://calcio-toscana-scraper.onrender.com' }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          # Codici di uscita di `bin/cli.js scrape`: 0 = tutto aggiornato,
          # 1 = nessuna lega aggiornata, 3 = dati in regressione (scartati).
          # Con il 3 le leghe NON in regressione sono comunque aggiornate nei
          # file: vanno committate (altrimenti i dati buoni si perdono al
          # checkout successivo), ma il job deve fallire alla fine così GitHub
          # notifica invece di lasciare solo un'annotazione.
          REPORT_FILE="$RUNNER_TEMP/scrape-report.json"
          rm -f "$REPORT_FILE"

          scrape_rc=0
          if [ "${{ inputs.use_cache }}" != "true" ]; then
            # 1. Sul runner Raspberry Pi l'IP residenziale di casa non viene bloccato
            #    dal WAF: lo scraping diretto impiega appena ~2 secondi in HTTP puro.
            node bin/cli.js scrape all --refresh --report-file "$REPORT_FILE" || scrape_rc=$?
          else
            scrape_rc=1
          fi

          # Legge il report scritto dal CLI (refreshed = leghe davvero aggiornate)
          refreshed=0
          if [ -f "$REPORT_FILE" ]; then
            refreshed=$(node -e "process.stdout.write(String(require(process.argv[1]).refreshed || 0))" "$REPORT_FILE")
          fi
          echo "Leghe aggiornate in questo giro: $refreshed"
          echo "regression=false" >> "$GITHUB_OUTPUT"

          if [ "$scrape_rc" = "0" ]; then
            echo "aggiornato=true" >> "$GITHUB_OUTPUT"
            echo "✔ Dati aggiornati direttamente dal runner Raspberry Pi."
          elif [ "$scrape_rc" = "3" ]; then
            # Regressione: nessun fallback remoto (avrebbe dati più vecchi),
            # commit solo se qualche lega è stata aggiornata davvero.
            echo "regression=true" >> "$GITHUB_OUTPUT"
            if [ "$refreshed" != "0" ]; then
              echo "aggiornato=true" >> "$GITHUB_OUTPUT"
              echo "⚠ Regressione su alcune leghe: committo le $refreshed leghe aggiornate e faccio fallire il job."
            else
              echo "aggiornato=false" >> "$GITHUB_OUTPUT"
              echo "⚠ Regressione su tutte le leghe: nessun dato nuovo da committare."
            fi
          else
            # 2. Fallback su istanza remota (es. Render) se richiesto use_cache o in caso di errore
            extra=""
            if [ "${{ inputs.use_cache }}" = "true" ]; then
              extra="--no-refresh"
              echo "Uso la cache già aggiornata dell'istanza remota."
            fi

            rc=0
            node bin/fetch-from-render.js $extra || rc=$?

            if [ "$rc" = "0" ]; then
              echo "aggiornato=true" >> "$GITHUB_OUTPUT"
              echo "✔ Tutti i campionati aggiornati dall'istanza remota."
            elif [ "$rc" = "1" ]; then
              echo "aggiornato=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Aggiornamento remoto parziale: alcune leghe non sono state aggiornate (vedi log)."
            else
              echo "aggiornato=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Aggiornamento non riuscito. I dati in cache sono stati conservati."
            fi
          fi

      - name: Rigenerazione export (CSV, ICS)
        if: steps.aggiorna.outputs.aggiornato == 'true'
        run: |
          # 1. Aggiorna SQLite con i dati freschi e rigenera lo snapshot JSONL
          node bin/db-import.js
          node bin/db-snapshot.js dump
          # 2. Rigenera gli export (CSV, ICS)
          node bin/cli.js export all --format csv
          node bin/cli.js export all --format ics

      - name: Rigenerazione asset dashboard per GitHub Pages
        run: npm run build:pages

      - name: Commit e Push dei dati aggiornati
        id: commit
        run: |
          # Identità SOLO per questo repository: sul runner self-hosted il job gira
          # con lo stesso utente di sistema del proprietario, quindi un
          # `--global` riscriverebbe la sua configurazione git su tutto il Pi.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Se l'utente ha premuto manualmente il tasto "Aggiorna dal Web" (workflow_dispatch),
          # committiamo sempre per aggiornare la data e confermare la sincronizzazione su GitHub Pages.
          # Se l'avvio è automatico (cron schedulato), saltiamo il commit se non ci sono nuovi risultati.
          has_sports_changes=false
          if node bin/data-changed.js; then
            has_sports_changes=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$has_sports_changes" = "true" ]; then
            git add data/cache/ data/exports/ data/db/snapshot.jsonl index.html app.js style.css favicon.svg
            if git diff --staged --quiet; then
              echo "Nessun aggiornamento trovato, i dati sono già aggiornati."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore(data): aggiornamento calendari e classifiche"
              git pull --rebase origin main
              git push
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git checkout -- data/ index.html app.js style.css favicon.svg
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Dati sportivi invariati: nessun commit creato."
          fi

      # I push fatti con GITHUB_TOKEN non innescano altri workflow, quindi la
      # build di Pages va richiesta esplicitamente per pubblicare i dati nuovi.
      - name: Pubblicazione su GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          if [ "$code" = "201" ] || [ "$code" = "204" ]; then
            echo "Build di GitHub Pages richiesta (HTTP $code)."
          else
            echo "::warning::Richiesta di build Pages non riuscita (HTTP $code): il sito si aggiornerà al prossimo push."
          fi

      # La regressione fa fallire il job DOPO aver committato le leghe sane:
      # così GitHub notifica (il solo warning non genera notifiche) e i dati
      # buoni non vanno persi al checkout successivo.
      - name: Segnala la regressione sui dati
        if: always() && steps.aggiorna.outputs.regression == 'true'
        env:
          REPORT_FILE: ${{ runner.temp }}/scrape-report.json
        run: |
          echo "::error title=Regressione dati::Alcune leghe hanno restituito dati in calo (classifica più corta o meno partite con risultato). La cache buona è stata conservata e le leghe sane sono state pubblicate. Se il calo è reale (es. partita annullata da Tuttocampo) rilancia a mano con: node bin/cli.js scrape all --refresh --accept-regression"

          if [ -f "$REPORT_FILE" ]; then
            node -e '
              const report = require(process.argv[1]);
              console.log("--- Dettaglio regressione ---");
              for (const r of report.regressions || []) {
                console.log(`• ${r.name}: ${r.reason}`);
              }
              console.log(`Leghe aggiornate: ${report.refreshed}/${report.total}`);
            ' "$REPORT_FILE"
          fi

          exit 1
