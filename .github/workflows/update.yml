name: Aggiornamento Automatico Calendari

on:
  schedule:
    # Ogni domenica sera alle 21:00 UTC (dopo le partite del weekend)
    - cron: '0 21 * * 0'
    # Ogni lunedì mattina alle 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Permette di avviare l'aggiornamento a mano da GitHub
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pages: write

jobs:
  # Test automatici: parser, exporter e API del server + coerenza degli asset
  # di root pubblicati su GitHub Pages (che sono generati da public/).
  verifica:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: Configurazione Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Installazione dipendenze
        run: npm ci

      - name: Verifica asset di root allineati a public/
        run: npm run check:pages

      - name: Test
        run: npm test

  scrape-and-update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: Configurazione Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Installazione dipendenze
        run: npm ci

      - name: Aggiornamento dati (istanza sempre accesa, IP non bloccato dal WAF)
        id: aggiorna
        env:
          RENDER_URL: ${{ vars.RENDER_URL || 'https://calcio-toscana-scraper.onrender.com' }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          rc=0
          node bin/fetch-from-render.js || rc=$?

          if [ "$rc" = "0" ]; then
            echo "aggiornato=true" >> "$GITHUB_OUTPUT"
            echo "Tutti i campionati aggiornati dall'istanza remota."
          elif [ "$rc" = "1" ]; then
            echo "aggiornato=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Aggiornamento remoto parziale: alcune leghe non sono state aggiornate (vedi log). Gli export vengono comunque rigenerati con i dati più recenti disponibili."
          elif node bin/cli.js scrape all --refresh; then
            echo "aggiornato=true" >> "$GITHUB_OUTPUT"
            echo "Dati aggiornati direttamente dal runner."
          else
            echo "aggiornato=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Aggiornamento non riuscito: istanza remota irraggiungibile e scraping dal runner bloccato dal WAF di Tuttocampo. I dati in cache sono stati conservati."
          fi

      - name: Rigenerazione export (CSV, ICS, JSON)
        if: steps.aggiorna.outputs.aggiornato == 'true'
        run: node bin/cli.js export all

      - name: Rigenerazione asset dashboard per GitHub Pages
        run: npm run build:pages

      - name: Commit e Push dei dati aggiornati
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Salta il commit se l'unica differenza sono i campi volatili
          # (lastUpdated nella cache/export JSON e DTSTAMP negli ICS)
          if node bin/data-changed.js; then
            git add data/cache/ data/exports/ index.html app.js style.css
            if git diff --staged --quiet; then
              echo "Nessun aggiornamento trovato, i dati sono già aggiornati."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore(data): aggiornamento automatico calendari e classifiche"
              git push
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git checkout -- data/ index.html app.js style.css
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Dati sportivi invariati: nessun commit creato."
          fi

      # I push fatti con GITHUB_TOKEN non innescano altri workflow, quindi la
      # build di Pages va richiesta esplicitamente per pubblicare i dati nuovi.
      - name: Pubblicazione su GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          if [ "$code" = "201" ] || [ "$code" = "204" ]; then
            echo "Build di GitHub Pages richiesta (HTTP $code)."
          else
            echo "::warning::Richiesta di build Pages non riuscita (HTTP $code): il sito si aggiornerà al prossimo push."
          fi
